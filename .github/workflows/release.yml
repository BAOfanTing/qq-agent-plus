name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 必须取完整历史：发布说明要按「上一个 tag..本次 tag」算提交列表，
      # 默认的 depth=1 浅克隆里没有上一个 tag，说明会变成空的。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 发布前再跑一遍与 CI 相同的检查，任何一步失败都不会出 Release
      - run: npm ci
      - name: 语法检查（src / scripts / test / ui，递归）
        run: |
          set -e
          count=0
          # 与 ci.yml 同一步：tag push 不会触发 CI，所以这里必须自己跑一遍 ——
          # 而 ops scan 只扫 src 下的 .js，scripts/test/ui 的语法门禁全在这一步
          for f in $(find src scripts test ui -type f \( -name '*.js' -o -name '*.mjs' \) | sort); do
            node --check "$f"
            count=$((count + 1))
          done
          echo "语法检查通过（$count 个文件）"
      - run: node src/ops.js scan --strict
      - run: npm run test:unit
      - run: npm run test:local

      - name: 生成发布说明草稿
        run: |
          {
            echo "## 本次改动"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$(git tag --sort=-creatordate | sed -n '2p')..${GITHUB_REF_NAME}" 2>/dev/null || git log --no-merges --pretty=format:'- %s (%h)' -20
            echo
            echo
            echo "安装与部署见 [docs/OPS.md](docs/OPS.md)。"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 创建 Release（草稿，确认后发布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
