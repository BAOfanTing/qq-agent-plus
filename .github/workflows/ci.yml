name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 语法检查（src / scripts / test / ui，递归）
        run: |
          set -e
          # 递归：src/ 按领域分了子目录，用 src/*.js 这种 glob 会静默漏掉子目录。
          # 用 mapfile 并断言非空：`for f in $(find ...)` 会吃掉 find 的退出码，find 失败时
          # 循环体一次都不跑，却照样打印"通过（0 个文件）"并成功退出。
          mapfile -t files < <(find src scripts test ui -type f \( -name '*.js' -o -name '*.mjs' \) | sort)
          [[ ${#files[@]} -gt 0 ]] || { echo "没有找到任何待检查文件"; exit 1; }
          for f in "${files[@]}"; do node --check "$f"; done
          echo "语法检查通过（${#files[@]} 个文件）"

      - name: Shell 脚本语法检查
        run: bash -n deploy.sh deploy-all.sh manage.sh

      - name: 未定义调用扫描（严格模式）
        run: node src/ops.js scan --strict

      - name: 单元测试
        run: npm run test:unit

      - name: 本地回归测试
        run: npm run test:local

      - name: 提示词 / 渲染 / 滚动回归
        run: |
          node test/test-prompt.mjs
          node test/render-test.mjs
          node test/scroll-test.mjs
