name: Cleanup stale GHCR tag

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale 0.9.11 image version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          pkg="qq-agent-plus"
          version="0.9.11"
          ids="$(gh api --paginate "/users/${owner}/packages/container/${pkg}/versions" \
            --jq ".[] | select((.metadata.container.tags // []) | index(\"${version}\")) | .id")"
          if [ -z "${ids}" ]; then
            echo "no ${version} image version; nothing to delete"
            exit 0
          fi
          for id in ${ids}; do
            echo "deleting package version ${id}"
            gh api -X DELETE "/users/${owner}/packages/container/${pkg}/versions/${id}"
          done
