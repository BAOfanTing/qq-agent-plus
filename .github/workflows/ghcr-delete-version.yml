name: ghcr-delete-version

# 一次性运维工具：删除 GHCR 上带指定 tag 的镜像版本。
# 只用于「tag 已发布但镜像构建自错误的提交」这种需要重跑 tag 构建的场景：
# 发布后的镜像 tag 是不可变的，正常发版**不要**用它覆盖已有版本。
# 必须手动输入 DELETE 才会执行。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要删除的镜像 tag（必须与现有 tag 完全一致，例如 0.9.6）'
        required: true
      confirm:
        description: '输入 DELETE 确认删除（其他值不做任何事）'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete versions carrying the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "confirm 不是 DELETE，不做任何事"
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "缺少 tag"
            exit 1
          fi
          ids="$(gh api "users/$OWNER/packages/container/qq-agent-plus/versions?per_page=100" \
            --jq ".[] | select(.metadata.container.tags | index(\"$TAG\")) | .id")"
          if [ -z "$ids" ]; then
            echo "没有找到带 tag $TAG 的版本"
            exit 1
          fi
          for id in $ids; do
            echo "删除 version $id（tag $TAG）"
            gh api -X DELETE "users/$OWNER/packages/container/qq-agent-plus/versions/$id"
          done
          echo "已删除；现在重跑对应 tag 的 Docker 工作流即可重建"
